<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Открытка по ссылке</title>
  <meta name="description" content="Соберите анимированную открытку за минуту и отправьте ссылкой: конверт, конфетти, снег или сердечки. Без регистрации.">
  <meta name="theme-color" content="#1a1030">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💌</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lobster&family=Caveat:wght@600;700&family=Onest:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root { --bg: #1a1030; --panel: #251a42; --line: #3a2e5c; --text: #f5f0ff; --muted: #a99cc9; --acc: #ff7ab6; color-scheme: dark; }
    html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--text); font: 15px/1.5 Onest, system-ui, sans-serif; }
    button, input, textarea, select { font: inherit; color: inherit; }
    button { cursor: pointer; }
    .editor { max-width: 1040px; margin: 0 auto; padding: calc(20px + env(safe-area-inset-top)) 16px calc(40px + env(safe-area-inset-bottom)); }
    .editor h1 { margin: 0 0 4px; font: 800 clamp(26px, 7vw, 36px)/1.1 Onest, sans-serif; }
    .sub { margin: 0 0 18px; color: var(--muted); }
    .layout { display: grid; gap: 16px; }
    @media (min-width: 880px) { .layout { grid-template-columns: minmax(0, 1fr) 400px; align-items: start; } .stage { position: sticky; top: 16px; } }
    .panel { padding: 18px; border-radius: 22px; background: var(--panel); border: 1px solid var(--line); display: grid; gap: 14px; min-width: 0; }
    .lbl { font-size: 13px; font-weight: 700; color: var(--muted); margin-bottom: 6px; }
    .occ { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 6px; }
    .occ button, .fx button { display: grid; justify-items: center; gap: 2px; padding: 10px 4px; border: 1.5px solid var(--line); border-radius: 14px; background: transparent; font-size: 12px; font-weight: 600; }
    .occ button span, .fx button span { font-size: 24px; }
    .occ button.on, .fx button.on { border-color: var(--acc); background: rgba(255, 122, 182, 0.12); }
    .fx { display: grid; grid-template-columns: repeat(auto-fill, minmax(78px, 1fr)); gap: 6px; }
    .themes { display: flex; gap: 8px; flex-wrap: wrap; }
    .themes button { width: 42px; height: 42px; border-radius: 50%; border: 3px solid transparent; background: var(--g); }
    .themes button.on { border-color: #fff; }
    .two { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 10px; }
    input, textarea { width: 100%; padding: 12px; border: 1.5px solid var(--line); border-radius: 12px; background: #1e1536; font-size: 16px; outline: none; }
    input:focus, textarea:focus { border-color: var(--acc); }
    textarea { min-height: 110px; resize: vertical; }
    .msgrow { display: flex; justify-content: space-between; align-items: center; }
    .link { border: 0; background: none; color: var(--acc); font-weight: 700; font-size: 13px; padding: 0; }
    .btn { width: 100%; padding: 15px; border: 0; border-radius: 14px; background: var(--acc); color: #2a0618; font: 800 16px Onest, sans-serif; }
    .btn--ghost { background: transparent; border: 1.5px solid var(--line); color: var(--text); }
    .stage .frame { position: relative; overflow: hidden; border-radius: 26px; aspect-ratio: 4 / 5; background: var(--g); display: grid; place-items: center; padding: 22px; }
    .stage .actions { display: grid; gap: 8px; margin-top: 12px; }
    canvas.fx-layer { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
    /* сама открытка */
    .card { position: relative; z-index: 1; width: 100%; max-width: 420px; padding: 28px 24px 26px; border-radius: 22px; background: var(--card); color: var(--ink); text-align: center; box-shadow: 0 30px 60px -20px rgba(0, 0, 0, 0.5); }
    .card .emo { font-size: clamp(54px, 15vw, 72px); line-height: 1; animation: bob 2.6s ease-in-out infinite; }
    @keyframes bob { 50% { transform: translateY(-6px) rotate(-4deg); } }
    .card h2 { margin: 10px 0 8px; font: 400 clamp(30px, 8vw, 40px)/1.1 Lobster, cursive; color: var(--acc2); }
    .card .to { font: 700 clamp(22px, 6vw, 26px)/1.2 Caveat, cursive; }
    .card .msg { margin: 8px 0 14px; font: 600 clamp(19px, 5vw, 22px)/1.35 Caveat, cursive; white-space: pre-line; min-height: 2.6em; }
    .card .from { font: 700 20px Caveat, cursive; opacity: 0.8; }
    /* режим получателя */
    .viewer { position: fixed; inset: 0; display: grid; place-items: center; padding: 20px; background: var(--g); overflow: auto; }
    .viewer[hidden] { display: none; }
    .envelope { position: relative; z-index: 2; width: min(340px, 86vw); aspect-ratio: 3 / 2; border-radius: 12px; background: var(--card); box-shadow: 0 30px 60px -20px rgba(0, 0, 0, 0.55); cursor: pointer; perspective: 800px; border: 0; padding: 0; }
    .envelope::before { content: ''; position: absolute; inset: 0; border-radius: 12px; background: linear-gradient(to top right, transparent 49.5%, rgba(0, 0, 0, 0.07) 50%) left / 50% 100% no-repeat, linear-gradient(to top left, transparent 49.5%, rgba(0, 0, 0, 0.07) 50%) right / 50% 100% no-repeat; }
    .flap { position: absolute; left: 0; right: 0; top: 0; height: 60%; transform-origin: top; transition: transform 0.6s ease; }
    .flap::before { content: ''; position: absolute; inset: 0; background: var(--acc2); clip-path: polygon(0 0, 100% 0, 50% 100%); filter: brightness(0.92); }
    .seal { position: absolute; left: 50%; top: 52%; width: 54px; height: 54px; margin: -27px 0 0 -27px; border-radius: 50%; background: var(--acc2); display: grid; place-items: center; font-size: 26px; box-shadow: 0 4px 10px rgba(0, 0, 0, 0.25); transition: opacity 0.3s; z-index: 2; }
    .envelope.open .flap { transform: rotateX(180deg); }
    .envelope.open .seal { opacity: 0; }
    .env-wrap { display: grid; justify-items: center; gap: 16px; text-align: center; color: var(--ink2); }
    .env-wrap p { margin: 0; font: 700 24px Caveat, cursive; }
    .env-wrap small { opacity: 0.75; font-weight: 600; }
    .reveal { display: grid; justify-items: center; gap: 14px; width: 100%; animation: rise 0.8s cubic-bezier(.2, .9, .3, 1.2); }
    @keyframes rise { from { transform: translateY(80px) scale(0.85); opacity: 0; } }
    .reveal .row { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; position: relative; z-index: 2; }
    .reveal .row button { padding: 12px 18px; border: 0; border-radius: 999px; background: rgba(255, 255, 255, 0.92); color: #2a1838; font-weight: 800; }
    .toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom)); transform: translateX(-50%); max-width: calc(100% - 32px); padding: 12px 18px; border-radius: 14px; background: #fff; color: #2a1838; font-weight: 700; opacity: 0; transition: opacity 0.2s; pointer-events: none; z-index: 10; text-align: center; }
    .toast.show { opacity: 1; }
    .back { display: inline-block; margin-top: 18px; color: var(--muted); font-size: 13px; }
  </style>
</head>
<body>
<div class="editor" id="editor">
  <h1>💌 Открытка по ссылке</h1>
  <p class="sub">Соберите открытку и отправьте ссылку в мессенджер. Получатель откроет конверт, а дальше запустятся конфетти, снег или сердечки.</p>
  <div class="layout">
    <div class="panel">
      <div><div class="lbl">Повод</div><div class="occ" id="occ"></div></div>
      <div class="two"><label><div class="lbl">Кому</div><input id="to" maxlength="30" placeholder="Маме"></label><label><div class="lbl">От кого</div><input id="from" maxlength="30" placeholder="Например, Саша"></label></div>
      <div><div class="msgrow"><div class="lbl">Текст</div><button class="link" id="another">↻ Другой вариант</button></div><textarea id="msg" maxlength="400"></textarea></div>
      <div><div class="lbl">Оформление</div><div class="themes" id="themes"></div></div>
      <div><div class="lbl">Эффект</div><div class="fx" id="fx"></div></div>
    </div>
    <div class="stage">
      <div class="frame" id="frame"><canvas class="fx-layer" id="fxPreview"></canvas><div class="card" id="cardPreview"></div></div>
      <div class="actions">
        <button class="btn" id="share">Отправить ссылкой</button>
        <button class="btn btn--ghost" id="preview">Посмотреть как получатель</button>
      </div>
    </div>
  </div>
  <a class="back" href="/">← Портфолио</a>
</div>
<div class="viewer" id="viewer" hidden><canvas class="fx-layer" id="fxView" style="position:fixed"></canvas><div id="viewBody" style="width:100%;display:grid;place-items:center"></div></div>
<div class="toast" id="toast"></div>
<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const OCC = {
    bday: ['🎂', 'День рождения', 'С днём рождения!', ['Пусть этот год будет самым тёплым, смешным и удачным. Мечтай смело — всё сбудется!', 'Желаю здоровья, любви и поводов улыбаться каждый день. Ты лучше всех!', 'Ещё один год крутых историй впереди. Пусть каждый день будет праздником!']],
    ny: ['🎄', 'Новый год', 'С Новым годом!', ['Пусть новый год принесёт много счастья, уюта и волшебства. Обнимаю!', 'Желаю, чтобы все планы сбылись, а хорошие люди были рядом. С праздником!', 'Пусть год будет щедрым на радость, приключения и чудеса.']],
    thanks: ['🙏', 'Спасибо', 'Спасибо!', ['Ты очень помог(ла) мне. Спасибо, что ты есть!', 'Без тебя ничего бы не получилось. Огромное человеческое спасибо!', 'Хочу просто сказать спасибо — за поддержку, советы и тепло.']],
    love: ['❤️', 'Любовь', 'Люблю тебя', ['С тобой каждый день становится лучше. Спасибо, что ты рядом.', 'Ты — моё самое любимое приключение.', 'Просто напоминаю: ты очень дорог(а) мне. Всегда.']],
    congrats: ['🎉', 'Поздравляю', 'Поздравляю!', ['Ты это сделал(а)! Горжусь тобой и радуюсь вместе с тобой.', 'Это заслуженный успех. Пусть дальше будет ещё круче!', 'Ура! Отличная новость — так держать!']],
    spring: ['🌷', '8 Марта', 'С 8 Марта!', ['Пусть весна принесёт тепло, цветы и только хорошие новости!', 'Желаю вдохновения, нежности и солнечного настроения каждый день.', 'Оставайся такой же яркой и неповторимой. С праздником весны!']],
    defend: ['🎖️', '23 Февраля', 'С 23 Февраля!', ['Желаю силы, надёжных друзей и побед во всём, за что берёшься!', 'Пусть рядом будут близкие, а впереди — только хорошие дороги.', 'Крепкого здоровья, уверенности и мирного неба!']],
    well: ['🌻', 'Выздоравливай', 'Выздоравливай!', ['Скорее поправляйся! Мы скучаем и ждём тебя.', 'Отдыхай, пей чай с малиной и возвращайся бодрым(ой)!', 'Желаю сил и скорейшего выздоровления. Обнимаю!']],
  };
  const THEMES = [
    { g: 'linear-gradient(135deg,#ff9a9e,#fad0c4)', card: '#fffaf6', ink: '#3a2030', acc2: '#e0457b', ink2: '#5a1f38' },
    { g: 'linear-gradient(135deg,#0f2027,#2c5364)', card: '#f4fbff', ink: '#14303d', acc2: '#1f7aa8', ink2: '#e9f6ff' },
    { g: 'linear-gradient(135deg,#7f00ff,#e100ff)', card: '#fff7ff', ink: '#311045', acc2: '#9b1fd6', ink2: '#fff' },
    { g: 'linear-gradient(135deg,#f7971e,#ffd200)', card: '#fffdf3', ink: '#3d2a05', acc2: '#e06c00', ink2: '#4a2c00' },
    { g: 'linear-gradient(135deg,#11998e,#38ef7d)', card: '#f6fff9', ink: '#0c3325', acc2: '#0e8a5c', ink2: '#05301f' },
    { g: 'linear-gradient(135deg,#141e30,#243b55)', card: '#1d2940', ink: '#eef3ff', acc2: '#ffd36e', ink2: '#eef3ff' },
  ];
  const FX = { confetti: ['🎊', 'Конфетти'], snow: ['❄️', 'Снег'], hearts: ['💕', 'Сердечки'], stars: ['✨', 'Звёзды'], balloons: ['🎈', 'Шарики'], petals: ['🌸', 'Лепестки'] };
  const DEFAULT_FX = { bday: 'balloons', ny: 'snow', thanks: 'stars', love: 'hearts', congrats: 'confetti', spring: 'petals', defend: 'stars', well: 'petals' };
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const b64e = (s) => btoa(unescape(encodeURIComponent(s))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  const b64d = (s) => decodeURIComponent(escape(atob(s.replace(/-/g, '+').replace(/_/g, '/'))));

  let C = { o: 'bday', to: '', from: '', msg: OCC.bday[3][0], th: 0, fx: 'balloons', v: 0 };

  // ---------- Частицы ----------
  function Particles(canvas) {
    const ctx = canvas.getContext('2d');
    let parts = [], type = 'confetti', raf = 0, w = 0, h = 0, dpr = 1;
    const COLORS = ['#ff4d6d', '#ffd166', '#06d6a0', '#118ab2', '#ef476f', '#ffffff', '#c77dff'];
    const resize = () => { const r = canvas.getBoundingClientRect(); dpr = Math.min(devicePixelRatio || 1, 2); w = r.width; h = r.height; canvas.width = w * dpr; canvas.height = h * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0); };
    const make = (init) => {
      const p = { x: Math.random() * w, y: init ? Math.random() * h : -20, r: 0, vr: (Math.random() - 0.5) * 0.2, t: Math.random() * 100, c: COLORS[Math.random() * COLORS.length | 0] };
      if (type === 'confetti') Object.assign(p, { vx: (Math.random() - 0.5) * 1.5, vy: 1.5 + Math.random() * 2.5, s: 5 + Math.random() * 6 });
      if (type === 'snow') Object.assign(p, { vx: 0, vy: 0.5 + Math.random() * 1.2, s: 1.5 + Math.random() * 3.5, c: '#fff' });
      if (type === 'hearts' || type === 'petals' || type === 'stars') Object.assign(p, { vx: 0, vy: 0.6 + Math.random() * 1.4, s: 12 + Math.random() * 14 });
      if (type === 'balloons') Object.assign(p, { y: init ? Math.random() * h : h + 60, vx: 0, vy: -(0.6 + Math.random() * 1.2), s: 18 + Math.random() * 14 });
      return p;
    };
    const glyph = { hearts: ['💖', '💕', '❤️', '💗'], petals: ['🌸', '🌷', '🌼', '🍃'], stars: ['✨', '⭐', '🌟'] };
    function frame() {
      raf = requestAnimationFrame(frame);
      ctx.clearRect(0, 0, w, h);
      const max = type === 'snow' ? 120 : type === 'confetti' ? 140 : 34;
      while (parts.length < max) parts.push(make(parts.length < max * 0.6 && !parts.started));
      parts.started = true;
      for (const p of parts) {
        p.t += 0.02; p.r += p.vr;
        p.x += p.vx + Math.sin(p.t) * (type === 'confetti' ? 0.6 : 0.5); p.y += p.vy;
        if (type === 'confetti') {
          ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r * 3); ctx.scale(1, Math.cos(p.t * 4));
          ctx.fillStyle = p.c; ctx.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2); ctx.restore();
        } else if (type === 'snow') {
          ctx.globalAlpha = 0.85; ctx.fillStyle = p.c; ctx.beginPath(); ctx.arc(p.x, p.y, p.s, 0, Math.PI * 2); ctx.fill(); ctx.globalAlpha = 1;
        } else if (type === 'balloons') {
          ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(Math.sin(p.t) * 0.1);
          ctx.strokeStyle = 'rgba(255,255,255,.6)'; ctx.beginPath(); ctx.moveTo(0, p.s); ctx.quadraticCurveTo(6, p.s * 1.8, 0, p.s * 2.6); ctx.stroke();
          ctx.fillStyle = p.c; ctx.beginPath(); ctx.ellipse(0, 0, p.s * 0.8, p.s, 0, 0, Math.PI * 2); ctx.fill();
          ctx.fillStyle = 'rgba(255,255,255,.45)'; ctx.beginPath(); ctx.ellipse(-p.s * 0.3, -p.s * 0.35, p.s * 0.18, p.s * 0.28, -0.5, 0, Math.PI * 2); ctx.fill();
          ctx.restore();
        } else {
          if (!p.g) p.g = glyph[type][Math.random() * glyph[type].length | 0];
          ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.font = `${p.s}px serif`; ctx.textAlign = 'center'; ctx.fillText(p.g, 0, 0); ctx.restore();
        }
      }
      parts = parts.filter((p) => (type === 'balloons' ? p.y > -80 : p.y < h + 30));
    }
    return {
      start(t) { type = t; parts = []; resize(); cancelAnimationFrame(raf); frame(); },
      stop() { cancelAnimationFrame(raf); ctx.clearRect(0, 0, w, h); },
      resize,
    };
  }

  const cardHtml = (c, typed) => {
    const o = OCC[c.o];
    return `<div class="emo">${o[0]}</div><h2>${o[2]}</h2>${c.to ? `<div class="to">${esc(c.to)},</div>` : ''}<div class="msg" ${typed ? 'data-typed' : ''}>${typed ? '' : esc(c.msg)}</div>${c.from ? `<div class="from">— ${esc(c.from)}</div>` : ''}`;
  };
  const applyTheme = (el, th) => { const t = THEMES[th]; el.style.setProperty('--g', t.g); el.style.setProperty('--card', t.card); el.style.setProperty('--ink', t.ink); el.style.setProperty('--acc2', t.acc2); el.style.setProperty('--ink2', t.ink2); };

  // ---------- Редактор ----------
  const fxPreview = Particles($('fxPreview'));
  function renderEditor() {
    $('occ').innerHTML = Object.entries(OCC).map(([k, o]) => `<button data-o="${k}" class="${C.o === k ? 'on' : ''}"><span>${o[0]}</span>${o[1]}</button>`).join('');
    $('themes').innerHTML = THEMES.map((t, i) => `<button data-t="${i}" style="--g:${t.g}" class="${C.th === i ? 'on' : ''}" aria-label="Оформление ${i + 1}"></button>`).join('');
    $('fx').innerHTML = Object.entries(FX).map(([k, f]) => `<button data-f="${k}" class="${C.fx === k ? 'on' : ''}"><span>${f[0]}</span>${f[1]}</button>`).join('');
    $('occ').querySelectorAll('[data-o]').forEach((b) => b.onclick = () => { C.o = b.dataset.o; C.v = 0; C.msg = OCC[C.o][3][0]; C.fx = DEFAULT_FX[C.o]; $('msg').value = C.msg; renderEditor(); });
    $('themes').querySelectorAll('[data-t]').forEach((b) => b.onclick = () => { C.th = +b.dataset.t; renderEditor(); });
    $('fx').querySelectorAll('[data-f]').forEach((b) => b.onclick = () => { C.fx = b.dataset.f; renderEditor(); });
    updatePreview(true);
  }
  let lastFx = null;
  function updatePreview(restartFx) {
    applyTheme($('frame'), C.th);
    $('cardPreview').innerHTML = cardHtml(C);
    if (restartFx || lastFx !== C.fx) { fxPreview.start(C.fx); lastFx = C.fx; }
  }
  $('to').oninput = () => { C.to = $('to').value.trim(); updatePreview(); };
  $('from').oninput = () => { C.from = $('from').value.trim(); updatePreview(); };
  $('msg').oninput = () => { C.msg = $('msg').value; updatePreview(); };
  $('another').onclick = () => { const list = OCC[C.o][3]; C.v = (C.v + 1) % list.length; C.msg = list[C.v]; $('msg').value = C.msg; updatePreview(); };
  addEventListener('resize', () => fxPreview.resize());

  const link = () => `${location.origin}${location.pathname}#c=${b64e(JSON.stringify({ o: C.o, to: C.to, from: C.from, msg: C.msg, th: C.th, fx: C.fx }))}`;
  $('share').onclick = async () => {
    const url = link();
    if (navigator.share && matchMedia('(pointer: coarse)').matches) { try { await navigator.share({ title: 'Тебе открытка 💌', text: `Тебе открытка 💌${C.from ? ' — ' + C.from : ''}`, url }); return; } catch {} }
    try { await navigator.clipboard.writeText(url); toast('Ссылка скопирована — отправьте её в мессенджер 💌'); } catch { prompt('Скопируйте ссылку:', url); }
  };
  $('preview').onclick = () => { history.pushState(null, '', link()); openViewer(C); };

  // ---------- Получатель ----------
  const fxView = Particles($('fxView'));
  function chime() {
    try {
      const a = new (window.AudioContext || window.webkitAudioContext)();
      [784, 988, 1175, 1568].forEach((f, i) => { const o = a.createOscillator(), g = a.createGain(), t = a.currentTime + i * 0.09; o.frequency.value = f; o.type = 'sine'; g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.12, t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.6); o.connect(g).connect(a.destination); o.start(t); o.stop(t + 0.65); });
    } catch {}
  }
  function openViewer(c) {
    $('editor').hidden = true; $('viewer').hidden = false;
    applyTheme($('viewer'), c.th); fxView.stop();
    document.querySelector('meta[name=theme-color]').content = '#222';
    $('viewBody').innerHTML = `<div class="env-wrap"><button class="envelope" id="env" aria-label="Открыть конверт"><span class="flap"></span><span class="seal">${OCC[c.o][0]}</span></button>
      <p>${c.to ? esc(c.to) + ', вам' : 'Вам'} открытка!</p><small>${c.from ? `Отправитель: ${esc(c.from)} · ` : ''}нажмите на конверт</small></div>`;
    $('env').onclick = () => {
      $('env').classList.add('open'); chime();
      setTimeout(() => {
        $('viewBody').innerHTML = `<div class="reveal"><div class="card">${cardHtml(c, true)}</div><div class="row"><button id="again">↻ Ещё раз</button><button id="reply">💌 Сделать свою открытку</button></div></div>`;
        fxView.start(c.fx);
        typeText($('viewBody').querySelector('[data-typed]'), c.msg);
        $('again').onclick = () => openViewer(c);
        $('reply').onclick = () => { history.replaceState(null, '', location.pathname); fxView.stop(); $('viewer').hidden = true; $('editor').hidden = false; renderEditor(); };
      }, 650);
    };
  }
  function typeText(el, text) {
    let i = 0;
    const step = () => { if (!el.isConnected) return; el.textContent = text.slice(0, ++i); if (i < text.length) setTimeout(step, text[i - 1] === '.' || text[i - 1] === '!' ? 260 : 28); };
    step();
  }
  addEventListener('popstate', () => { if (!location.hash.startsWith('#c=')) { fxView.stop(); $('viewer').hidden = true; $('editor').hidden = false; renderEditor(); } });

  let tt; function toast(t) { $('toast').textContent = t; $('toast').classList.add('show'); clearTimeout(tt); tt = setTimeout(() => $('toast').classList.remove('show'), 2400); }

  let incoming = null;
  if (location.hash.startsWith('#c=')) { try { incoming = JSON.parse(b64d(location.hash.slice(3))); if (!OCC[incoming.o]) incoming = null; else { incoming.th = Math.min(THEMES.length - 1, Math.max(0, +incoming.th || 0)); if (!FX[incoming.fx]) incoming.fx = 'confetti'; incoming.msg = String(incoming.msg || '').slice(0, 400); } } catch { incoming = null; } }
  $('msg').value = C.msg;
  if (incoming) openViewer(incoming); else renderEditor();
})();
</script>
</body>
</html>
